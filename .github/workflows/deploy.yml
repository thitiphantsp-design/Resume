name: Resume CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─── Job 1: Check โค้ด ───
  check:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          if ! grep -iq "<!doctype html>" index.html; then
            echo "❌ Error: Missing <!DOCTYPE html> in index.html"
            exit 1
          fi
          echo "✅ HTML validation passed"

      - name: Check file existence
        run: |
          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Missing $file"
              exit 1
            fi
          done
          echo "✅ All required files found"

  # ─── Job 2: Deploy (รันหลัง check ผ่านเท่านั้น) ───
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check                      # รอ job check ผ่านก่อน
    if: github.ref == 'refs/heads/main'  # deploy เฉพาะ branch main
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4